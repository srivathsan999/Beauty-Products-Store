<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found - Beauty Store</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#D4A5A5',
            secondary: '#F8F6F4',
            accent: '#A8556F',
            'text-dark': '#2A2A2A',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/css/custom.css">
  <link rel="stylesheet" href="assets/css/tablet.css">
</head>

<body class="min-h-screen flex items-center justify-center bg-secondary dark:bg-gray-900">
  <div class="text-center px-4">
    <div class="glass-strong rounded-2xl p-12 max-w-2xl mx-auto">
      <h1 class="text-9xl font-heading font-bold text-accent mb-4">404</h1>
      <h2 class="text-3xl md:text-4xl font-heading font-bold mb-4 text-text-dark dark:text-white">Page Not Found</h2>
      <p class="text-gray-600 dark:text-gray-400 mb-8 text-lg">Sorry, the page you are looking for doesn't exist or has
        been moved.</p>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a href="index.html" class="btn-primary inline-block">Go Home</a>
        <a href="shop.html" class="btn-outline inline-block">Continue Shopping</a>
      </div>
    </div>

    <!-- Theme Toggle (Bottom Right) -->
    <div class="fixed bottom-4 right-4">
      <button id="theme-toggle"
        class="p-3 bg-white dark:bg-gray-800 rounded-full shadow-lg hover:shadow-xl transition-shadow text-text-dark dark:text-gray-100">
        <svg id="theme-toggle-light" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor"
          viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
        </svg>
        <svg id="theme-toggle-dark" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor"
          viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
      </button>
    </div>
  </div>

  <script src="assets/js/theme.js"></script>
</body>

</html>
